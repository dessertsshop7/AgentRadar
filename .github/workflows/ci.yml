name: AgentRadar checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_DB: agentradar_test
          POSTGRES_USER: agentradar
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentradar -d agentradar_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agentradar:test_only@127.0.0.1:5432/agentradar_test
      TEST_DATABASE_URL: postgresql+psycopg://agentradar:test_only@127.0.0.1:5432/agentradar_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: python -m pip install -r apps/api/requirements-dev.lock
      - run: python -m ruff check --config apps/api/pyproject.toml apps/api tests
      - run: python -m ruff format --check --config apps/api/pyproject.toml apps/api tests
      - name: Unit tests (database doubles)
        run: python -m pytest -c apps/api/pyproject.toml apps/api/tests -m 'not integration'
      - name: Migrate and verify PostgreSQL
        run: |
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini current
          python -m pytest -c apps/api/pyproject.toml apps/api/tests -m integration

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: python -m pip install -r apps/api/requirements-dev.lock
      - run: python -m playwright install chromium
      - name: Start the real stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Healthy services
        run: python -m pytest -c apps/api/pyproject.toml tests/e2e -m e2e
      - name: Database unavailable
        run: |
          docker compose stop db
          HEALTH_SCENARIO=database_unhealthy python -m pytest -c apps/api/pyproject.toml tests/e2e/test_health_page.py -m e2e
          docker compose start db
      - name: API unavailable
        run: |
          docker compose stop api
          HEALTH_SCENARIO=unreachable python -m pytest -c apps/api/pyproject.toml tests/e2e/test_health_page.py -m e2e
          docker compose start api
      - name: Service logs
        if: always()
        run: docker compose logs --no-color --tail 100
      - name: Stop this job's stack
        if: always()
        run: docker compose down
